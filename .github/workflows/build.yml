name: Build PhotoSafe Check

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build?
        type: choice
        required: true
        default: all
        options:
          - all
          - windows
          - linux
          - macos
      after_build:
        description: After successful builds
        type: choice
        required: true
        default: artifacts_only
        options:
          - artifacts_only
          - draft_release
      release_tag:
        description: Version tag for manual draft release (e.g. v0.3.7; new tags only)
        type: string
        required: false
        default: ''

# Build jobs only read the repository. Only the draft-release job can create a release.
permissions:
  contents: read

jobs:
  select-targets:
    name: Select build targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Set build matrix
        id: targets
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
          AFTER_BUILD: ${{ inputs.after_build || 'artifacts_only' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json, os, re
          if os.environ['AFTER_BUILD'] == 'draft_release':
              if os.environ.get('GITHUB_REF') != 'refs/heads/' + os.environ['DEFAULT_BRANCH']:
                  raise SystemExit('Manual draft releases must run from the default branch.')
              if os.environ['PLATFORM'] != 'all':
                  raise SystemExit('Draft releases require All platforms; choose platform=all.')
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?', os.environ['RELEASE_TAG']):
                  raise SystemExit('Enter a new release tag like v0.3.7 when selecting draft_release.')
          all_targets = [
              {"platform": "windows", "os": "windows-latest", "rid": "win-x64"},
              {"platform": "linux", "os": "ubuntu-24.04", "rid": "linux-x64"},
              {"platform": "macos", "os": "macos-15-intel", "rid": "osx-x64"},
              {"platform": "macos", "os": "macos-latest", "rid": "osx-arm64"},
          ]
          choice = os.environ['PLATFORM']
          selected = [x for x in all_targets if choice == 'all' or x['platform'] == choice]
          if not selected:
              raise SystemExit(f'No build targets for {choice}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps({'include': selected}, separators=(',', ':')) + '\n')
          print('Building:', ', '.join(x['rid'] for x in selected))
          PY

  build:
    name: ${{ matrix.rid }} portable build
    needs: select-targets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Node.js (extension tests)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Python (packaging)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test browser extension
        run: node --test

      - name: Test packaging (no user data, executable permissions)
        run: python scripts/test_build_packaging.py

      - name: Test Windows GUI subsystem verification
        run: python scripts/test_windows_gui_subsystem.py

      - name: Restore app dependencies
        run: dotnet restore PhotoSafeCheck/PhotoSafeCheck.csproj

      - name: Compile desktop application
        run: dotnet build PhotoSafeCheck/PhotoSafeCheck.csproj --configuration Release --no-restore

      - name: Embed GitHub Releases download link
        env:
          RELEASES_URL: https://github.com/${{ github.repository }}/releases
        shell: bash
        run: python scripts/configure_release_links.py --github-releases-url "$RELEASES_URL"

      - name: Publish self-contained app
        run: >-
          dotnet publish PhotoSafeCheck/PhotoSafeCheck.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output out/publish

      - name: Verify published EXE and embedded assets (no GUI)
        run: python scripts/verify_published.py --publish out/publish --rid ${{ matrix.rid }}

      - name: Stage single-file app in its own folder
        run: >-
          python scripts/package_preview.py
          --publish out/publish
          --dest out/bundle
          --rid ${{ matrix.rid }}

      - name: Make clean platform download archive
        run: >-
          python scripts/archive_release.py
          --bundle out/bundle
          --output out/dist
          --rid ${{ matrix.rid }}

      - name: Upload downloadable portable build
        uses: actions/upload-artifact@v6
        with:
          name: PhotoSafeCheck-${{ matrix.rid }}-portable
          path: out/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Package browser extension
        if: matrix.rid == 'win-x64'
        run: python scripts/package_extension.py --dest out/extension/PhotoSafeCheck-extension.zip

      - name: Upload browser extension
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v6
        with:
          name: PhotoSafeCheck-browser-extension
          path: out/extension/PhotoSafeCheck-extension.zip
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Prepare GitHub draft release
    needs: [select-targets, build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.after_build == 'draft_release')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform build archives
        uses: actions/download-artifact@v7
        with:
          pattern: PhotoSafeCheck-*-portable
          merge-multiple: true
          path: out/release

      - name: Download extension archive
        uses: actions/download-artifact@v7
        with:
          name: PhotoSafeCheck-browser-extension
          path: out/release

      - name: Create draft release (manual review required)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$MANUAL_RELEASE_TAG"
            # A manual draft release creates its new tag at the workflow commit.
            # Refuse an existing tag to avoid publishing artifacts for a different commit.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists. Use a fresh tag for manual release, or push that tag to trigger the tag-based workflow." >&2
              exit 1
            fi
            gh release create "$TAG" out/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft --generate-notes --title "PhotoSafe Check $TAG"
          else
            TAG="$GITHUB_REF_NAME"
            gh release create "$TAG" out/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft --generate-notes --title "PhotoSafe Check $TAG"
          fi
